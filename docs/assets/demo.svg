<svg xmlns="http://www.w3.org/2000/svg" width="838" height="570" viewBox="0 0 838 570" role="img" aria-label="semvet output for the acme-http example: six breaking changes in a minor release">
<rect width="838" height="570" rx="10" fill="#0d1117"/>
<rect width="838" height="34" rx="10" fill="#161b22"/>
<rect y="24" width="838" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<text x="22" y="52" xml:space="preserve"><tspan fill="#7ee787" font-weight="700">$ </tspan><tspan fill="#d4d7de">npx semvet examples/acme-http/current -b dir:examples/acme-http/v1.4.0</tspan></text>
<text x="22" y="71" xml:space="preserve"><tspan fill="#d4d7de" font-weight="700">semvet</tspan><tspan fill="#d4d7de">  acme-http  </tspan><tspan fill="#d4d7de" fill-opacity="0.65">1.4.0 → 1.5.0  (dir:v1.4.0 vs working tree)</tspan></text>
<text x="22" y="90" xml:space="preserve"></text>
<text x="22" y="109" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="700">BREAKING (6)</tspan></text>
<text x="22" y="128" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#ff6b6b">✖</tspan><tspan fill="#d4d7de"> package          minimum Node.js raised from &gt;=18 to &gt;=20</tspan></text>
<text x="22" y="147" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#ff6b6b">✖</tspan><tspan fill="#d4d7de"> Client           `request`: parameter or return type changed incompatibly</tspan></text>
<text x="22" y="166" xml:space="preserve"><tspan fill="#d4d7de">      </tspan><tspan fill="#d4d7de" fill-opacity="0.65">Type '(method: Method, path: string, opts?: RequestOptions | undefined) =&gt; Promise&lt;T&gt;' is n…</tspan></text>
<text x="22" y="185" xml:space="preserve"><tspan fill="#d4d7de">      </tspan><tspan fill="#d4d7de" fill-opacity="0.65">  Type 'Promise&lt;T&gt;' is not assignable to type 'Promise&lt;Response&lt;T&gt;&gt;'.</tspan></text>
<text x="22" y="204" xml:space="preserve"><tspan fill="#d4d7de">      </tspan><tspan fill="#d4d7de" fill-opacity="0.65">…</tspan></text>
<text x="22" y="223" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#ff6b6b">✖</tspan><tspan fill="#d4d7de"> createClient     a required parameter was added</tspan></text>
<text x="22" y="242" xml:space="preserve"><tspan fill="#d4d7de">      </tspan><tspan fill="#d4d7de" fill-opacity="0.65">Type '(baseUrl: string, apiKey: string) =&gt; Client' is not assignable to type '(baseUrl: str…</tspan></text>
<text x="22" y="261" xml:space="preserve"><tspan fill="#d4d7de">      </tspan><tspan fill="#d4d7de" fill-opacity="0.65">  Target signature provides too few arguments. Expected 2 or more, but got 1.</tspan></text>
<text x="22" y="280" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#ff6b6b">✖</tspan><tspan fill="#d4d7de"> LogLevel         enum member values changed: Debug 0→1, Info 1→2, Warn 2→3, +1 more</tspan></text>
<text x="22" y="299" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#ff6b6b">✖</tspan><tspan fill="#d4d7de"> parseLinkHeader  export was removed</tspan></text>
<text x="22" y="318" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#ff6b6b">✖</tspan><tspan fill="#d4d7de"> RequestOptions   removed member `timeout`</tspan></text>
<text x="22" y="337" xml:space="preserve"></text>
<text x="22" y="356" xml:space="preserve"><tspan fill="#7ee787" font-weight="700">FEATURES (2)</tspan></text>
<text x="22" y="375" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#7ee787">+</tspan><tspan fill="#d4d7de"> Method            union or enum gained members (can break exhaustive switches)</tspan></text>
<text x="22" y="394" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#7ee787">+</tspan><tspan fill="#d4d7de"> ./retry › jitter  new export</tspan></text>
<text x="22" y="413" xml:space="preserve"></text>
<text x="22" y="432" xml:space="preserve"><tspan fill="#7d8590" font-weight="700">NOTES (1)</tspan></text>
<text x="22" y="451" xml:space="preserve"><tspan fill="#d4d7de">  </tspan><tspan fill="#7d8590">·</tspan><tspan fill="#d4d7de"> DEFAULT_TIMEOUT  constant has a different literal value</tspan></text>
<text x="22" y="470" xml:space="preserve"></text>
<text x="22" y="489" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="700">✖ 1.4.0 → 1.5.0 is only a minor bump, but these changes need a major.</tspan></text>
<text x="22" y="508" xml:space="preserve"><tspan fill="#d4d7de">$ echo $?</tspan></text>
<text x="22" y="527" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="700">1</tspan></text>
</g>
</svg>
